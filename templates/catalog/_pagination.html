{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Paginación">
  {% if page_obj.has_previous %}
  <a href="?{% if extra_query %}{{ extra_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← anterior</a>
  {% endif %}
  <span>página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a href="?{% if extra_query %}{{ extra_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}">siguiente →</a>
  {% endif %}
</nav>
{% endif %}
